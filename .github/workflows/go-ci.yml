name: Go CI

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/go-ci.yml"
      - "lazy-tcp-proxy/**"
      - "html/**"

  pull_request:
    branches: ["**"]
    paths:
      - ".github/workflows/go-ci.yml"
      - "lazy-tcp-proxy/**"
      - "html/**"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: lazy-tcp-proxy/html/package-lock.json
      - name: Build HTML dashboard
        working-directory: lazy-tcp-proxy/html
        run: npm ci && npm run build
      - uses: actions/setup-go@v6
        with:
          go-version-file: lazy-tcp-proxy/go.mod
          cache-dependency-path: lazy-tcp-proxy/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          working-directory: lazy-tcp-proxy

  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: lazy-tcp-proxy/html/package-lock.json
      - name: Build HTML dashboard
        working-directory: lazy-tcp-proxy/html
        run: npm ci && npm run build
      - uses: actions/setup-go@v6
        with:
          go-version-file: lazy-tcp-proxy/go.mod
          cache-dependency-path: lazy-tcp-proxy/go.sum
      - name: vet
        working-directory: lazy-tcp-proxy
        run: go vet ./...
      - name: build
        working-directory: lazy-tcp-proxy
        run: go build ./...
      - name: test
        working-directory: lazy-tcp-proxy
        run: go test -race -count=1 ./...
      - name: build (kubernetes)
        working-directory: lazy-tcp-proxy
        run: go build -tags kubernetes ./...
      - name: test (kubernetes)
        working-directory: lazy-tcp-proxy
        run: go test -tags kubernetes -race -count=1 ./...

  docker-publish:
    name: Build & Publish Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute version
        id: version
        run: |
          VERSION="1.$(date +%Y%m%d).$(git rev-parse --short=8 HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./lazy-tcp-proxy
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            mountainpass/lazy-tcp-proxy:docker-${{ steps.version.outputs.version }}
            mountainpass/lazy-tcp-proxy:latest

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DOCKERHUB_URL="https://hub.docker.com/repository/docker/mountainpass/lazy-tcp-proxy/tags/docker-${VERSION}/"
          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --notes "Docker image: ${DOCKERHUB_URL}"
